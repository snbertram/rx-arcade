<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Capsule Hop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=DM+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet; canvas fills a 2:3 stage, menus float over it in a frosted panel. Single committed look (night pharmacy). */
:root {
  --bg: #0f1d24;
  --panel: #16303a;
  --glass: rgba(12, 26, 32, .82);
  --line: #2b5263;
  --ink: #eaf4f2;
  --muted: #8fb0ad;
  --amber: #e08a2c;
  --mint: #5fd3b4;
  --display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.stage { position: relative; height: 100%; max-height: 760px; aspect-ratio: 2 / 3; max-width: 100%; container-type: inline-size; }
#game { display: block; width: 100%; height: 100%; border-radius: 14px; background: var(--panel); cursor: pointer; }
#game:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
.hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.score { font-family: var(--display); font-size: clamp(30px, 13cqi, 58px); margin-top: 5%; text-shadow: 0 3px 0 rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.effect { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mint); min-height: 18px; font-variant-numeric: tabular-nums; }
.toast { margin-top: 6px; font-weight: 700; font-size: 15px; color: var(--amber); transition: opacity .4s; }

.card {
  margin-block: auto; width: min(92%, 360px); box-sizing: border-box;
  background: var(--glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
}
.card h1 { font-family: var(--display); font-size: clamp(22px, 8.5cqi, 34px); margin: 0; line-height: 1.05; text-wrap: balance; color: var(--mint); }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.card .go { color: var(--ink); font-size: 16px; font-weight: 700; }
.tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); font-weight: 700; }

.picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; pointer-events: auto; }
.chip {
  font: inherit; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px 5px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
}
.chip canvas { width: 64px; height: 30px; }
.chip span { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chip:hover { border-color: var(--muted); }
.chip:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.chip[aria-pressed="true"] { border-color: var(--mint); background: rgba(95, 211, 180, .12); }
.chip[aria-pressed="true"] span { color: var(--ink); }
.power { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line); padding-top: 10px; }
.power b { font-size: 14px; color: var(--ink); }
.power b em { font-style: normal; color: var(--mint); }
.power small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); font-weight: 700; }

.dose {
  position: absolute; right: 14px; bottom: 34px; pointer-events: auto;
  width: 74px; height: 74px; border-radius: 50%; border: none; cursor: pointer; padding: 0;
  font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
  background: conic-gradient(var(--mint) calc(var(--p, 0) * 1turn), var(--line) 0);
  display: grid; place-items: center;
}
.dose::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--glass); }
.dose span { position: relative; line-height: 1.1; }
.dose span i { display: block; font-style: normal; font-size: 10px; color: var(--muted); letter-spacing: .04em; }
.dose.ready { animation: throb 1s ease-in-out infinite; }
.dose.ready span i { color: var(--mint); }
.dose:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
@keyframes throb { 50% { transform: scale(1.07); } }
@media (prefers-reduced-motion: reduce) { .dose.ready { animation: none; } }
.foot { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
</style>

<div class="stage">
  <canvas id="game" width="400" height="600" tabindex="0" aria-label="Capsule Hop game. Press space or tap to hop, E to take a dose."></canvas>
  <div class="hud">
    <div class="score" id="score" hidden>0</div>
    <div class="effect" id="effect"></div>
    <div class="toast" id="toast" style="opacity:0">&nbsp;</div>
    <div class="card" id="card">
      <span class="tag" id="tag">Arcade hopper</span>
      <h1 id="headline">Capsule Hop</h1>
      <div class="picker" id="picker" role="group" aria-label="Choose your capsule"></div>
      <div class="power" id="power"></div>
      <p class="go" id="sub">Tap, click, or press Space to start</p>
    </div>
    <button class="dose" id="dose" type="button" hidden aria-label="Take a dose"><span>Dose<i id="doseNote">0/4</i></span></button>
    <div class="foot" id="best">Best: 0</div>
  </div>
</div>

<script>
(() => {
  const W = 400, H = 600, FLOOR = 560;
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), card = $('card'), bestEl = $('best'), doseBtn = $('dose'), effectEl = $('effect'), toastEl = $('toast');

  const C = { panel:'#16303a', far:'#1c3a45', shelf:'#24485a', amber:'#e08a2c', amberDk:'#a85f17',
              cap:'#f2f5f4', capShade:'#c9d3d1', label:'#fbf6ea', mint:'#5fd3b4', coral:'#ef6a5a', floor:'#0c171c' };

  // Each capsule: look + power. Powers are tied to what the drug actually does.
  const CAPSULES = [
    { id:'placebo', name:'Placebo', cls:'Sugar pill', a:'#f2f5f4', b:'#dfe6e4', power:'Placebo effect', kind:'passive',
      desc:'No active ingredient, but belief is strong. Each crash has a 1 in 5 chance of not counting.' },
    { id:'amox', name:'Amoxicillin', cls:'Penicillin antibiotic', a:'#8a2340', b:'#f2a7b8', power:'Bactericidal', dur:0,
      desc:'Blocks cell wall synthesis so bacteria burst. Take a dose to burst the next 3 cell walls in your path.' },
    { id:'eso', name:'Esomeprazole', cls:'Proton pump inhibitor', a:'#6b3fa0', b:'#6b3fa0', band:'#f2c94c', power:'Acid barrier', dur:6,
      desc:'Shuts down stomach acid pumps. Take a dose for a shield that absorbs one hit for 6 seconds.' },
    { id:'dph', name:'Diphenhydramine', cls:'1st-gen antihistamine', a:'#f07fa6', b:'#f2f5f4', power:'Drowsy', dur:5,
      desc:'Crosses into the brain and makes everyone sleepy. Take a dose to slow the world to half speed for 5 seconds.' },
    { id:'tams', name:'Tamsulosin', cls:'Alpha-1 blocker', a:'#7b8a3a', b:'#e98a3a', power:'Smooth muscle relaxant', dur:8,
      desc:'Relaxes smooth muscle so things flow through more easily. Take a dose to widen every gap for 8 seconds.' },
    { id:'fish', name:'Fish oil', cls:'Omega-3 softgel', a:'#e3a92b', b:'#e3a92b', gel:true, power:'Omega glide', dur:6,
      desc:'The supplement aisle classic, slippery and buoyant. Take a dose for floaty low gravity for 6 seconds.' },
  ];
  const DOSE_EVERY = 4;

  // Storage (per-viewer convenience only)
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  let bests = store.get('capsuleHopBests', {});
  const legacy = store.get('capsuleHopBest', 0);
  if (legacy && !bests.placebo) bests.placebo = legacy;
  let sel = CAPSULES.find(c => c.id === store.get('capsuleHopPick', 'amox')) || CAPSULES[1];

  // ---------- drawing a capsule (shared by game + picker) ----------
  function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
  function drawCapsule(g, def, R) {
    const L = def.gel ? R * 2.5 : R * 2.95;
    if (def.gel) {
      g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(2, 4, L / 2, R, 0, 0, 7); g.fill();
      const grd = g.createRadialGradient(-L * .15, -R * .3, 2, 0, 0, L / 2);
      grd.addColorStop(0, '#fbe08a'); grd.addColorStop(1, def.a);
      g.fillStyle = grd; g.beginPath(); g.ellipse(0, 0, L / 2, R, 0, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(-L * .12, -R * .45, L * .22, R * .18, 0, 0, 7); g.fill();
    } else {
      g.fillStyle = 'rgba(0,0,0,.25)'; rr(g, -L / 2 + 2, -R + 4, L, R * 2, R); g.fill();
      g.save(); rr(g, -L / 2, -R, L, R * 2, R); g.clip();
      g.fillStyle = def.a; g.fillRect(-L / 2, -R, L / 2, R * 2);
      g.fillStyle = def.b; g.fillRect(0, -R, L / 2, R * 2);
      if (def.band) { g.fillStyle = def.band; g.fillRect(-3, -R, 6, R * 2); }
      g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(-L / 2 + R * .4, -R + R * .27, L - R * .8, R * .27);
      g.restore();
      if (!def.band) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-1, -R, 2, R * 2); }
    }
    g.fillStyle = '#0f1d24';
    g.beginPath(); g.arc(-R * .66, -R * .13, R * .16, 0, 7); g.arc(-R * .2, -R * .13, R * .16, 0, 7); g.fill();
  }

  // ---------- picker ----------
  const picker = $('picker');
  CAPSULES.forEach(def => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.id = 'pick-' + def.id;
    b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', def.name + ': ' + def.power);
    const pc = document.createElement('canvas'); pc.width = 128; pc.height = 60;
    const g = pc.getContext('2d'); g.translate(62, 28); drawCapsule(g, def, 17);
    const s = document.createElement('span'); s.textContent = def.name;
    b.append(pc, s);
    b.addEventListener('click', () => { choose(def); cvs.focus({ preventScroll: true }); });
    picker.append(b);
  });
  function choose(def) {
    sel = def; store.set('capsuleHopPick', def.id);
    CAPSULES.forEach(c => $('pick-' + c.id).setAttribute('aria-pressed', String(c === def)));
    const how = def.kind === 'passive' ? 'Always on' : 'Charges every ' + DOSE_EVERY + ' cleared · E or tap Dose';
    $('power').innerHTML = '';
    const sm = document.createElement('small'); sm.textContent = def.cls;
    const bb = document.createElement('b'); bb.innerHTML = '<em></em>'; bb.firstChild.textContent = def.power;
    bb.append(' · ' + how);
    const ob = document.createElement('p'); ob.textContent = 'Obstacles: ' + OBS[def.id].name + '. ' + OBS[def.id].why;
    const p = document.createElement('p'); p.textContent = def.desc;
    $('power').append(sm, bb, p, ob);
    bestEl.textContent = 'Best with ' + def.name + ': ' + (bests[def.id] || 0);
    if (state === 'ready') pill.def = def;
  }

  // ---------- game state ----------
  const GRAV = 1500, HOP = -430, SPEED = 150, GAP = 165, SPACING = 215, BW = 64;
  let state = 'ready', pill, bottles, parts, score, t = 0, scroll = 0, last = 0, charge = 0, overAt = 0;
  let fx = { shield: 0, slow: 0, wide: 0, glide: 0 }, invuln = 0, toastT = 0;

  function reset() {
    pill = { x: 110, y: H * 0.42, vy: 0, r: 15, def: sel };
    bottles = []; parts = []; score = 0; charge = 0; invuln = 0;
    fx = { shield: 0, slow: 0, wide: 0, glide: 0 };
    for (let i = 0; i < 3; i++) addBottle(W + 120 + i * SPACING);
    scoreEl.textContent = '0'; effectEl.textContent = '';
    updateDose();
  }
  function addBottle(x) {
    const minMid = 80 + GAP / 2, maxMid = FLOOR - 80 - GAP / 2;
    bottles.push({ x, mid: minMid + Math.random() * (maxMid - minMid), gap: fx.wide > 0 ? GAP * 1.6 : GAP, passed: false, broken: false });
  }

  function toast(msg) { toastEl.textContent = msg; toastEl.style.opacity = 1; toastT = 1.4; }

  function showCard(tag, head, sub, withPicker) {
    $('tag').textContent = tag; $('headline').textContent = head; $('sub').textContent = sub;
    picker.hidden = !withPicker; $('power').hidden = !withPicker;
    card.hidden = false;
  }
  function startRun() {
    reset(); state = 'play'; card.hidden = true; scoreEl.hidden = false;
    doseBtn.hidden = sel.kind === 'passive';
  }

  function hop() {
    if (state === 'ready') startRun();
    else if (state === 'over') { if (performance.now() - overAt < 450) return; startRun(); }
    else if (state === 'paused') { state = 'play'; card.hidden = true; return; }
    if (state === 'play') pill.vy = fx.glide > 0 ? HOP * 0.72 : HOP;
  }
  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    showCard('Paused', 'On hold', 'Tap or press Space to resume · score ' + score, false);
  }
  function gameOver() {
    state = 'over'; overAt = performance.now(); doseBtn.hidden = true; effectEl.textContent = '';
    const prev = bests[sel.id] || 0, isBest = score > prev;
    if (isBest) { bests[sel.id] = score; store.set('capsuleHopBests', bests); }
    bestEl.textContent = 'Best with ' + sel.name + ': ' + (bests[sel.id] || 0);
    showCard(isBest && score > 0 ? 'New best for ' + sel.name : 'Dose missed',
             score + ' cleared', 'Tap or press Space to go again', true);
  }

  // ---------- powers ----------
  function updateDose() {
    const p = Math.min(1, charge / DOSE_EVERY);
    doseBtn.style.setProperty('--p', p);
    const busy = activeFx();
    doseBtn.classList.toggle('ready', p >= 1 && !busy);
    $('doseNote').textContent = busy ? 'active' : p >= 1 ? 'ready' : Math.floor(charge) + '/' + DOSE_EVERY;
  }
  function activeFx() { return fx.shield > 0 || fx.slow > 0 || fx.wide > 0 || fx.glide > 0; }
  function takeDose() {
    if (state !== 'play' || sel.kind === 'passive') return;
    if (charge < DOSE_EVERY || activeFx()) { if (!activeFx()) toast((DOSE_EVERY - Math.floor(charge)) + ' more to charge'); return; }
    charge = 0;
    switch (sel.id) {
      case 'amox': {
        let n = 0;
        for (const b of bottles) if (!b.broken && b.x + BW > pill.x - 20 && n < 3) { burst(b); n++; }
        toast('Cell walls ruptured'); break;
      }
      case 'eso': fx.shield = sel.dur; toast('Acid barrier up'); break;
      case 'dph': fx.slow = sel.dur; toast('Getting drowsy…'); break;
      case 'tams': fx.wide = sel.dur; toast('Smooth muscle relaxed'); break;
      case 'fish': fx.glide = sel.dur; toast('Omega glide'); break;
    }
    updateDose();
  }
  function burst(b) {
    b.broken = true;
    const top = b.mid - b.gap / 2, botY = b.mid + b.gap / 2;
    for (let i = 0; i < 26; i++) {
      const fromTop = i % 2 === 0;
      const y = fromTop ? Math.random() * top : botY + Math.random() * (FLOOR - botY);
      const pillBit = i % 3 === 0;
      parts.push({ x: b.x + Math.random() * BW, y, vx: (Math.random() - .3) * 260, vy: (Math.random() - .7) * 300,
                   s: pillBit ? 4 + Math.random() * 3 : 6 + Math.random() * 8, c: OBS[pill.def.id].shards[pillBit ? 0 : 1 + (Math.random() < .5 ? 0 : 1)],
                   round: pillBit, life: 1.2 + Math.random() * .6, rot: Math.random() * 6, vr: (Math.random() - .5) * 10 });
    }
  }
  // called when the capsule touches something deadly; returns true if it survives
  function survive(b) {
    if (invuln > 0) return true;
    if (fx.shield > 0) { fx.shield = 0; invuln = 0.6; if (b) burst(b); toast('Barrier absorbed the hit'); updateDose(); return true; }
    if (sel.id === 'placebo' && Math.random() < 0.2) { invuln = 0.6; if (b) burst(b); toast('Placebo effect!'); return true; }
    return false;
  }

  // ---------- update ----------
  function update(rdt) {
    t += rdt;
    if (toastT > 0) { toastT -= rdt; if (toastT <= 0) toastEl.style.opacity = 0; }
    for (const p of parts) { p.vy += 900 * rdt; p.x += p.vx * rdt; p.y += p.vy * rdt; p.rot += p.vr * rdt; p.life -= rdt; }
    parts = parts.filter(p => p.life > 0 && p.y < H + 20);
    if (state === 'ready') { pill.y = H * 0.42 + Math.sin(t * 3) * 8; scroll += SPEED * 0.4 * rdt; return; }
    if (state !== 'play') return;

    for (const k in fx) if (fx[k] > 0) fx[k] = Math.max(0, fx[k] - rdt);
    invuln = Math.max(0, invuln - rdt);
    const dt = fx.slow > 0 ? rdt * 0.5 : rdt;
    const grav = fx.glide > 0 ? GRAV * 0.5 : GRAV;

    scroll += SPEED * dt;
    pill.vy += grav * dt; pill.y += pill.vy * dt;
    if (pill.y - pill.r < 0) { pill.y = pill.r; pill.vy = 0; }

    const targetGap = fx.wide > 0 ? GAP * 1.6 : GAP;
    for (const b of bottles) {
      b.x -= SPEED * dt;
      b.gap += (targetGap - b.gap) * Math.min(1, rdt * 4);
      if (!b.passed && b.x + BW < pill.x - pill.r) {
        b.passed = true; score++; scoreEl.textContent = score;
        if (sel.kind !== 'passive' && !activeFx() && charge < DOSE_EVERY) { charge++; if (charge === DOSE_EVERY) toast('Dose ready · press E'); }
        updateDose();
      }
      if (b.broken) continue;
      const pr = pill.r - 2, top = b.mid - b.gap / 2;
      if (pill.x + pr > b.x && pill.x - pr < b.x + BW && (pill.y - pr < top || pill.y + pr > top + b.gap)) {
        if (!survive(b)) return gameOver();
      }
    }
    if (bottles[0].x + BW < -10) { bottles.shift(); addBottle(bottles[bottles.length - 1].x + SPACING); }
    if (pill.y + pill.r >= FLOOR) {
      pill.y = FLOOR - pill.r;
      if (survive(null)) pill.vy = HOP * 1.1; else return gameOver();
    }

    const labels = [];
    if (fx.shield > 0) labels.push('Barrier ' + fx.shield.toFixed(1) + 's');
    if (fx.slow > 0) labels.push('Drowsy ' + fx.slow.toFixed(1) + 's');
    if (fx.wide > 0) labels.push('Relaxed ' + fx.wide.toFixed(1) + 's');
    if (fx.glide > 0) labels.push('Glide ' + fx.glide.toFixed(1) + 's');
    effectEl.textContent = labels.join(' · ');
    if (!activeFx() && doseBtn.querySelector('i').textContent === 'active') updateDose();
  }

  // ---------- render ----------
  function drawBackground() {
    ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, H);
    const off = (scroll * 0.25) % 80;
    for (let row = 0; row < 4; row++) {
      const y = 120 + row * 120;
      ctx.fillStyle = C.shelf; ctx.fillRect(0, y, W, 6);
      for (let i = -1; i < 7; i++) {
        const x = i * 80 - off + (row % 2) * 40;
        const h = 26 + ((i + row * 3) % 3 + 3) % 3 * 8;
        ctx.fillStyle = C.far; rr(ctx, x, y - h, 22, h, 4); ctx.fill();
        ctx.fillRect(x + 3, y - h - 6, 16, 6);
      }
    }
    ctx.fillStyle = C.floor; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = C.shelf; ctx.fillRect(0, FLOOR, W, 4);
    ctx.fillStyle = C.far;
    const fo = scroll % 40;
    for (let x = -fo; x < W; x += 40) ctx.fillRect(x, FLOOR + 16, 20, 3);
    if (fx.slow > 0) { ctx.fillStyle = 'rgba(120, 90, 200, .18)'; ctx.fillRect(0, 0, W, FLOOR); }
  }

  // Each capsule gets obstacles from its own pharmacology. Drawn with the gap end at y, extending down h px.
  const OBS = {
    placebo: { name:'sugar cubes', why:'A placebo is basically a sugar pill.', shards:['#ffffff', '#f4f1ea', '#dcd6c8'] },
    amox:    { name:'bacterial cell walls', why:'Amoxicillin blocks the peptidoglycan cross-links that hold these walls together.', shards:['#cfe6ff', '#8e5ad6', '#5b3594'] },
    eso:     { name:'stomach lining', why:'Esomeprazole shuts down the proton pumps in these parietal cells.', shards:['#f2c94c', '#e07d8f', '#b9576b'] },
    dph:     { name:'pillows', why:'Diphenhydramine is famously sedating.', shards:['#ffffff', '#b8b2e6', '#8d86c9'] },
    tams:    { name:'smooth muscle', why:'Tamsulosin relaxes this smooth muscle to open things up.', shards:['#f6d2c9', '#c96a6a', '#9c4a4f'] },
    fish:    { name:'sardine tins', why:'Fish oil comes from oily fish like sardines.', shards:['#9fd0ff', '#c7cfd4', '#8a959c'] },
  };

  function drawColumn(x, y, h, flipped) {
    if (h < 24) return;
    ctx.save();
    if (flipped) { ctx.translate(0, y * 2 + h); ctx.scale(1, -1); }
    const txt = (s, tx, ty, font, col) => {
      ctx.save(); ctx.translate(tx, ty); if (flipped) ctx.scale(1, -1);
      ctx.font = font; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 0); ctx.restore();
    };
    DRAW[pill.def.id](x, y, h, txt);
    ctx.restore();
  }

  const DRAW = {
    placebo(x, y, h) {
      const s = 30;
      for (let row = 0; row * s < h; row++) {
        for (let c = 0; c < 2; c++) {
          const cx = x + 1 + c * (s + 2) + (row % 2 ? 2 : -2), cy = y + row * s;
          ctx.fillStyle = (row + c) % 2 ? '#f4f1ea' : '#e9e4d8'; rr(ctx, cx, cy, s, s - 2, 4); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(cx + 3, cy + 3, s - 6, 3);
          ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(cx + s - 5, cy + 4, 3, s - 10);
          ctx.fillStyle = 'rgba(160,150,130,.35)';
          for (let i = 0; i < 5; i++) ctx.fillRect(cx + 5 + ((i * 7 + row * 3 + c * 5) % 20), cy + 8 + ((i * 11 + row) % 16), 2, 2);
        }
      }
    },
    amox(x, y, h) {
      ctx.fillStyle = '#4a2a78'; rr(ctx, x, y + 8, BW, h - 8, 6); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(x, y + 8, BW, h - 8); ctx.clip();
      for (let row = 0; 18 + row * 18 < h; row++) {
        const ry = y + 18 + row * 18;
        ctx.strokeStyle = 'rgba(200,180,240,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, ry); ctx.lineTo(x + BW, ry); ctx.stroke();
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = i % 2 ? '#8e5ad6' : '#5fd3b4';
          ctx.beginPath(); ctx.arc(x + 7 + i * 12.5 + (row % 2) * 6, ry, 4.2, 0, 7); ctx.fill();
        }
        if (row % 2 === 0) {
          ctx.strokeStyle = 'rgba(242,201,76,.75)'; ctx.lineWidth = 1.5;
          for (let i = 0; i < 3; i++) { const px = x + 13 + i * 19; ctx.beginPath(); ctx.moveTo(px, ry + 4); ctx.lineTo(px + 3, ry + 9); ctx.lineTo(px, ry + 14); ctx.stroke(); }
        }
      }
      ctx.restore();
      ctx.fillStyle = '#cfe6ff'; rr(ctx, x - 4, y, BW + 8, 10, 5); ctx.fill();
      ctx.fillStyle = '#9fbfe0'; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(x + i * 8, y + 5, 2, 0, 7); ctx.fill(); }
    },
    eso(x, y, h, txt) {
      ctx.fillStyle = '#c4566c'; rr(ctx, x, y, BW, h, 10); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, BW, h); ctx.clip();
      ctx.strokeStyle = 'rgba(255,190,200,.45)'; ctx.lineWidth = 3;
      for (let f = 0; f < 3; f++) { ctx.beginPath(); for (let yy = y + 30; yy < y + h; yy += 6) ctx.lineTo(x + 14 + f * 18 + Math.sin(yy * .08 + f) * 5, yy); ctx.stroke(); }
      ctx.restore();
      for (let i = 0; i < 3; i++) {
        const cx = x + 11 + i * 21, cy = y + 13;
        ctx.fillStyle = '#f0a0ae'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
        ctx.fillStyle = '#7d2f45'; ctx.beginPath(); ctx.arc(cx, cy + 1, 3.5, 0, 7); ctx.fill();
      }
      for (let i = 0; i < 3; i++) if (h > 70 + i * 50) txt('H⁺', x + 18 + (i % 2) * 28, y + 48 + i * 50 + Math.sin(t * 2 + i) * 4, '700 12px DM Sans, sans-serif', '#f2c94c');
    },
    dph(x, y, h, txt) {
      const ph = 34;
      for (let i = 0; i * (ph - 4) < h; i++) {
        const py = y + i * (ph - 4), off = (i % 2 ? 3 : -3);
        ctx.fillStyle = i % 2 ? '#b8b2e6' : '#e8e6f6'; rr(ctx, x - 4 + off, py, BW + 8, ph, 14); ctx.fill();
        ctx.strokeStyle = 'rgba(80,70,140,.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
        rr(ctx, x + off, py + 4, BW, ph - 8, 11); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(80,70,140,.35)'; ctx.beginPath(); ctx.arc(x + BW / 2 + off, py + ph / 2, 2.5, 0, 7); ctx.fill();
      }
      txt('z', x + BW - 2, y - 12 - (t * 12 % 10), '700 14px DM Sans, sans-serif', 'rgba(232,230,246,.8)');
    },
    tams(x, y, h) {
      ctx.fillStyle = '#9c4a4f'; rr(ctx, x, y, BW, h, 8); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, BW, h); ctx.clip();
      for (let row = 0; row * 34 < h + 34; row++) for (let c = 0; c < 4; c++) {
        const cx = x + 8 + c * 16, cy = y + 14 + row * 34 + (c % 2) * 17;
        ctx.fillStyle = '#d98078'; ctx.beginPath(); ctx.ellipse(cx, cy, 6.5, 17, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#5c2a33'; ctx.beginPath(); ctx.ellipse(cx, cy, 2, 5, 0, 0, 7); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = '#f6d2c9'; rr(ctx, x - 3, y, BW + 6, 7, 3); ctx.fill();
    },
    fish(x, y, h) {
      const th = 40;
      for (let i = 0; i * th < h; i++) {
        const ty = y + i * th;
        ctx.fillStyle = '#c7cfd4'; rr(ctx, x - 3, ty, BW + 6, th - 3, 8); ctx.fill();
        ctx.fillStyle = '#2f6fc4'; ctx.fillRect(x - 3, ty + 9, BW + 6, th - 21);
        ctx.fillStyle = '#9fd0ff';
        ctx.beginPath(); ctx.ellipse(x + BW / 2 - 4, ty + th / 2 - 2, 13, 5, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + BW / 2 + 8, ty + th / 2 - 2); ctx.lineTo(x + BW / 2 + 16, ty + th / 2 - 8); ctx.lineTo(x + BW / 2 + 16, ty + th / 2 + 4); ctx.fill();
        ctx.fillStyle = '#0f1d24'; ctx.beginPath(); ctx.arc(x + BW / 2 - 13, ty + th / 2 - 3, 1.4, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x, ty + 3, BW - 4, 2);
        if (i === 0) { ctx.strokeStyle = '#8a959c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 12, ty + 5, 6, 0, 7); ctx.stroke(); }
      }
    },
  };

  function drawBottles() {
    for (const b of bottles) {
      if (b.broken) continue;
      const top = b.mid - b.gap / 2;
      drawColumn(b.x, -10, top + 10, true);
      drawColumn(b.x, top + b.gap, FLOOR - (top + b.gap), false);
    }
  }
  function drawParts() {
    for (const p of parts) {
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      if (p.round) { rr(ctx, -p.s, -p.s / 2, p.s * 2, p.s, p.s / 2); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
      ctx.restore();
    }
  }
  function drawPill() {
    const tilt = state === 'ready' ? Math.sin(t * 3) * 0.15 : Math.max(-0.5, Math.min(1.2, pill.vy / 600));
    ctx.save(); ctx.translate(pill.x, pill.y);
    if (fx.shield > 0 || invuln > 0) {
      const a = fx.shield > 0 ? (fx.shield < 1.5 ? (Math.sin(t * 20) > 0 ? .55 : .2) : .45) : .25;
      ctx.strokeStyle = `rgba(242, 201, 76, ${a + .3})`; ctx.fillStyle = `rgba(107, 63, 160, ${a})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 32 + Math.sin(t * 6) * 2, 0, 7); ctx.fill(); ctx.stroke();
    }
    if (fx.glide > 0) {
      ctx.fillStyle = 'rgba(227, 169, 43, .35)';
      for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.arc(-14 - i * 12, Math.sin(t * 8 + i) * 3, 5 - i, 0, 7); ctx.fill(); }
    }
    ctx.rotate(tilt);
    drawCapsule(ctx, pill.def, pill.r);
    if (fx.slow > 0) { ctx.rotate(-tilt); ctx.fillStyle = C.ink || '#eaf4f2'; ctx.font = '700 13px DM Sans, sans-serif'; ctx.fillStyle = '#eaf4f2';
      ctx.fillText('z', 18, -18 - (t * 20 % 10)); ctx.fillText('z', 26, -28 - (t * 14 % 8)); }
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - (last || now)) / 1000); last = now;
    update(dt);
    drawBackground(); drawBottles(); drawParts(); drawPill();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  cvs.addEventListener('pointerdown', e => { e.preventDefault(); cvs.focus({ preventScroll: true }); hop(); });
  doseBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); takeDose(); });
  doseBtn.addEventListener('click', e => { if (e.detail === 0) takeDose(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) hop(); }
    else if (e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { if (!e.repeat) takeDose(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') { state === 'paused' ? hop() : pause(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', pause);

  reset();
  choose(sel);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
