<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rx Arcade</title>

<style>
/* Layout: a pharmacy shelf wall. Each disease state is a shelf; each game is a labeled Rx carton on it. Clicking a carton opens the game in a full-screen player. */
:root {
  --bg: #eaf1f0;
  --shelf: #d6e2e0;
  --surface: #ffffff;
  --line: #c3d3d1;
  --ink: #0f2a2e;
  --muted: #557174;
  --amber: #c9701c;
  --teal: #0f7d84;
  --teal-soft: #d5ecec;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1a1c; --shelf: #132629; --surface: #172d31; --line: #26444a;
  --ink: #e3efed; --muted: #8fadab; --amber: #f0a24a; --teal: #4fc3c0; --teal-soft: #173b3e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1a1c; --shelf: #132629; --surface: #172d31; --line: #26444a;
  --ink: #e3efed; --muted: #8fadab; --amber: #f0a24a; --teal: #4fc3c0; --teal-soft: #173b3e;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.1; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

header { padding-block: 40px 28px; display: grid; gap: 12px; }
.mark { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.8rem); letter-spacing: -.02em; }
h1 em { font-style: normal; color: var(--amber); }
.lead { color: var(--muted); max-width: 58ch; font-size: 1.05rem; }
.meta { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); letter-spacing: .04em; }

.shelf { padding-block: 26px 30px; border-top: 1px solid var(--line); }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.shelf-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; letter-spacing: .01em; }
.count { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; padding-bottom: 14px; border-bottom: 8px solid var(--shelf); }

.carton {
  display: grid; grid-template-rows: auto 1fr auto; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.carton:hover { transform: translateY(-3px); border-color: var(--teal); box-shadow: 0 10px 24px -14px rgba(15, 42, 46, .5); }
.art { aspect-ratio: 16 / 7; max-width: 100%; display: block; width: 100%; }
.label { padding: 14px 16px 12px; display: grid; gap: 6px; align-content: start; }
.label .rx { font-family: var(--f-mono); font-size: .72rem; color: var(--amber); letter-spacing: .08em; }
.label h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.label p { color: var(--muted); font-size: .94rem; }
.sig { display: flex; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px dashed var(--line); font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.sig b { color: var(--teal); font-weight: 500; }

.empty {
  border: 2px dashed var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 6px; align-content: center; min-height: 140px;
  color: var(--muted);
}
.row.waiting { grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
.row.waiting .empty { min-height: 96px; }
.empty b { color: var(--ink); font-family: var(--f-display); font-weight: 500; font-size: .95rem; }
.empty span { font-size: .9rem; }

footer { padding-block: 26px 48px; color: var(--muted); font-size: .85rem; max-width: 70ch; }

/* Player */
.player { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr; }
.player[hidden] { display: none; }
.bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.back { font: 600 .92rem var(--f-body); color: var(--ink); background: var(--teal-soft); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.back:hover { background: var(--line); }
.bar h2 { font-family: var(--f-display); font-weight: 700; font-size: 1rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .tab { font-size: .85rem; color: var(--muted); }
.frame { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

let rxNo = 1001;
const filled = SHELVES.filter(sh => Object.values(GAMES).some(g => [].concat(g.shelf).includes(sh.id)));
const waiting = SHELVES.filter(sh => !filled.includes(sh));
$('#shelves').innerHTML = filled.map(sh => {
  const games = Object.entries(GAMES).filter(([, g]) => [].concat(g.shelf).includes(sh.id));
  const cards = games.map(([id, g]) => `
    <a class="carton" href="#${id}" data-id="${id}">
      ${ART[g.art]}
      <div class="label"><span class="rx">Rx #${rxNo++} · ${g.sig}</span><h3>${g.title}</h3><p>${g.blurb}</p></div>
      <div class="sig"><span>Qty: <b>${g.meta}</b></span><span>Refills: <b>unlimited</b></span></div>
    </a>`).join('');
  return `<section class="shelf"><div class="shelf-head"><h2>${sh.name}</h2><span class="count">${games.length + (games.length === 1 ? ' game' : ' games')}</span></div><div class="row">${cards}</div></section>`;
}).join('') + (waiting.length ? `<section class="shelf"><div class="shelf-head"><h2>Shelves being stocked</h2><span class="count">Coming soon</span></div><div class="row waiting">${
  waiting.map(sh => `<div class="empty"><b>${sh.name}</b><span>No games yet</span></div>`).join('')}</div></section>` : '');

function route() {
  const id = location.hash.slice(1);
  const g = GAMES[id];
  if (g) {
    $('#p-title').textContent = g.title;
    $('#p-tab').href = g.file;
    if ($('#frame').getAttribute('src') !== g.file) $('#frame').src = g.file;
    $('#player').hidden = false; $('#home').hidden = true;
    document.title = g.title + ' · Rx Arcade';
    $('#frame').focus();
  } else {
    $('#player').hidden = true; $('#home').hidden = false;
    $('#frame').removeAttribute('src');
    document.title = 'Rx Arcade';
  }
}
$('#back').addEventListener('click', () => { location.hash = ''; });
window.addEventListener('hashchange', route);
route();
</script>

</body></html>
